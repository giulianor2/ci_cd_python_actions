name: Pipeline CI de Python

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # JOB 1: verificação de estilo (rápido e barato, roda primeiro)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instala o flake8
        run: pip install flake8
      - name: Roda o linter
        run: flake8 . --max-line-length=100

  # JOB 2: testes (só roda se o lint passar)
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"          # reaproveita downloads do pip entre execuções
      - name: Instala dependências
        run: pip install -r requirements.txt
      - name: Executa testes
        run: pytest -v